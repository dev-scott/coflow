version: "3.9"

services:
  # ─── Base de données MongoDB (locale pour conteneurisation) ─────────────────────
  mongo:
    image: mongo:7
    container_name: coflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - coflow-net

  # ─── Backend API TypeScript (Node.js / Express v5) ────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    networks:
      - coflow-net

  # ─── Frontend Next.js 15+ (App Router / React 19) ─────────────────────────────
  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    container_name: coflow-frontend-next
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend-next/.env.local
    depends_on:
      - backend
    networks:
      - coflow-net

volumes:
  mongo-data:

networks:
  coflow-net:
    driver: bridge
