version: "3.9"

services:
  # ─── Base de données MongoDB ───────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: coflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - coflow-net

  # ─── Backend API (Node.js / Express) ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/coflow
      JWT_SECRET: ${JWT_SECRET:-coflow_docker_secret_change_me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SEND_GRID_API: ${SEND_GRID_API:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      ARCJET_ENV: development
      ARCJET_KEY: ${ARCJET_KEY:-ajkey_test_00000000000000000000000000000000}
      NODE_ENV: production
    depends_on:
      - mongo
    networks:
      - coflow-net

  # ─── Frontend (React Router 7 / Vite) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coflow-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api-v1
    depends_on:
      - backend
    networks:
      - coflow-net

volumes:
  mongo-data:

networks:
  coflow-net:
    driver: bridge
