<svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ombre d'élévation douce du squircle -->
    <filter id="tileShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <!-- Ombre de profondeur des pétales -->
    <filter id="petalDepth" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0F291E" flood-opacity="0.16" />
    </filter>

    <!-- Dégradé Pétales Verticaux (Forêt vers Sauge) -->
    <linearGradient id="petalV" x1="50" y1="18" x2="50" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="50%" stop-color="#1B4332" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>

    <!-- Dégradé Pétales Horizontaux (Émeraude vers Sauge lumineux) -->
    <linearGradient id="petalH" x1="18" y1="50" x2="82" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52A77A" />
      <stop offset="50%" stop-color="#366B50" />
      <stop offset="100%" stop-color="#52A77A" />
    </linearGradient>

    <!-- Dégradé Pétales Diagonaux (Lumière d'éclosion) -->
    <linearGradient id="petalDiag" x1="28" y1="28" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7CCBA2" />
      <stop offset="100%" stop-color="#3E8662" />
    </linearGradient>

    <!-- Reflet satiné sur le squircle blanc -->
    <linearGradient id="tileSheen" x1="50" y1="3" x2="50" y2="97" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>

  <!-- 1. Conteneur Squircle Blanc Satiné -->
  <g filter="url(#tileShadow)">
    <rect x="3.5" y="3.5" width="93" height="93" rx="24" fill="url(#tileSheen)" />
    <rect x="3.5" y="3.5" width="93" height="93" rx="24" stroke="#E2E8F0" stroke-width="1" />
  </g>

  <g filter="url(#petalDepth)">
    <!-- 2. Pétales Diagonaux Radiaux (Éclosion aux 4 coins) -->
    <path
      d="M 28 28 C 39 33 45 42 50 50 C 42 45 33 39 28 28 Z"
      fill="url(#petalDiag)"
      opacity="0.78"
    />
    <path
      d="M 72 72 C 61 67 55 58 50 50 C 58 55 67 61 72 72 Z"
      fill="url(#petalDiag)"
      opacity="0.78"
    />
    <path
      d="M 72 28 C 67 39 58 45 50 50 C 55 42 61 33 72 28 Z"
      fill="url(#petalDiag)"
      opacity="0.78"
    />
    <path
      d="M 28 72 C 33 61 42 55 50 50 C 45 58 39 67 28 72 Z"
      fill="url(#petalDiag)"
      opacity="0.78"
    />

    <!-- 3. Pétales Majeurs Verticaux (Axe Y) -->
    <path
      d="M 50 17 C 65 30 65 47 50 50 C 35 47 35 30 50 17 Z"
      fill="url(#petalV)"
    />
    <path
      d="M 50 83 C 65 70 65 53 50 50 C 35 53 35 70 50 83 Z"
      fill="url(#petalV)"
    />

    <!-- 4. Pétales Majeurs Horizontaux (Axe X) -->
    <path
      d="M 17 50 C 30 35 47 35 50 50 C 47 65 30 65 17 50 Z"
      fill="url(#petalH)"
      opacity="0.94"
    />
    <path
      d="M 83 50 C 70 35 53 35 50 50 C 53 65 70 65 83 50 Z"
      fill="url(#petalH)"
      opacity="0.94"
    />

    <!-- 5. Cœur de Bourgeon Central -->
    <circle cx="50" cy="50" r="5.5" fill="#FFFFFF" />
    <circle cx="50" cy="50" r="3.4" fill="#2D6A4F" />
    <circle cx="50" cy="50" r="1.4" fill="#A7F3D0" />
  </g>
</svg>
